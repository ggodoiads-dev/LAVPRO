name: Configure Vercel Env Vars

# Roda sob demanda. Usa a API HTTP da Vercel (sem CLI interativa) para
# definir as 6 variaveis de ambiente em Production + Preview + Development.
# No fim, faz empty commit que dispara o redeploy automatico.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve project id and team scope
        id: project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          # Primeiro tenta sem team (conta pessoal); se nao achar, varre teams.
          PROJECT_ID=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/lavpro" \
            | jq -r '.id // empty')
          TEAM_ID=""
          if [ -z "$PROJECT_ID" ]; then
            TEAMS=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v2/teams" | jq -r '.teams[].id')
            for t in $TEAMS; do
              PROJECT_ID=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v10/projects/lavpro?teamId=$t" \
                | jq -r '.id // empty')
              if [ -n "$PROJECT_ID" ]; then
                TEAM_ID="$t"
                break
              fi
            done
          fi
          if [ -z "$PROJECT_ID" ]; then
            echo "Projeto 'lavpro' nao encontrado em nenhum team"
            exit 1
          fi
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
          echo "team_id=$TEAM_ID"       >> $GITHUB_OUTPUT
          echo "Project: $PROJECT_ID (team: ${TEAM_ID:-pessoal})"

      - name: Set env vars via Vercel API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SB_ANON: ${{ secrets.SUPABASE_ANON_KEY }}
          SB_SR:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          TEAM_ID:    ${{ steps.project.outputs.team_id }}
        run: |
          set -e

          qs=""
          if [ -n "$TEAM_ID" ]; then qs="?teamId=$TEAM_ID"; fi

          # Apaga vars antigas para evitar duplicatas / conflito de tipo.
          existing=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PROJECT_ID/env$qs?decrypt=false")

          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY \
                      SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_APP_URL \
                      NEXT_PUBLIC_APP_NAME CRON_SECRET; do
            ids=$(echo "$existing" | jq -r ".envs[]? | select(.key == \"$name\") | .id")
            for id in $ids; do
              echo "Removendo $name (id=$id)"
              curl -sS -X DELETE -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v9/projects/$PROJECT_ID/env/$id$qs" \
                >/dev/null
            done
          done

          # Helper: adiciona em production+preview+development
          upsert() {
            local key="$1"
            local value="$2"
            local type="$3"   # plain | encrypted | sensitive

            if [ -z "$value" ]; then
              echo "ERRO: valor vazio para $key"
              exit 1
            fi

            body=$(jq -n \
              --arg k "$key" \
              --arg v "$value" \
              --arg t "$type" \
              '{key:$k, value:$v, type:$t, target:["production","preview","development"]}')

            resp=$(curl -sS -w "\n%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v10/projects/$PROJECT_ID/env$qs" \
              -d "$body")

            code=$(echo "$resp" | tail -1)
            body_out=$(echo "$resp" | sed '$d')

            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "FALHOU $key ($code): $body_out"
              exit 1
            fi
            echo "OK $key ($code)"
          }

          # NEXT_PUBLIC_* ficam como plain (vao expostos no browser mesmo)
          upsert "NEXT_PUBLIC_SUPABASE_URL"      "https://txblsmduxtxuskahmoat.supabase.co" "plain"
          upsert "NEXT_PUBLIC_SUPABASE_ANON_KEY" "$SB_ANON"                                   "plain"
          upsert "NEXT_PUBLIC_APP_URL"           "https://lavpro-snowy.vercel.app"            "plain"
          upsert "NEXT_PUBLIC_APP_NAME"          "LAVPRO"                                     "plain"

          # Secrets reais ficam encrypted
          upsert "SUPABASE_SERVICE_ROLE_KEY"     "$SB_SR"                                     "encrypted"
          upsert "CRON_SECRET"                   "orl5hx8man2wq0kufic1ezsgv6jdpbty9347"       "encrypted"

      - name: List env vars (sanity check)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID:   ${{ steps.project.outputs.project_id }}
          TEAM_ID:      ${{ steps.project.outputs.team_id }}
        run: |
          qs=""
          [ -n "$TEAM_ID" ] && qs="?teamId=$TEAM_ID"
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PROJECT_ID/env$qs?decrypt=false" \
            | jq -r '.envs[] | "\(.key)  \(.type)  \(.target|join(","))"'

      - name: Trigger production redeploy via empty commit
        run: |
          git config user.email "lavpro-ci@users.noreply.github.com"
          git config user.name  "lavpro-ci"
          git commit --allow-empty -m "ci: redeploy after env vars configured (via api)"
          git push

      - name: Summary
        run: |
          echo "### LAVPRO env vars configuradas via API" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "O empty commit dispara a Vercel; em ~3 min a URL abaixo deve retornar supabase=true, cron=true." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Health: https://lavpro-snowy.vercel.app/api/health" >> $GITHUB_STEP_SUMMARY
          echo "- Landing: https://lavpro-snowy.vercel.app/" >> $GITHUB_STEP_SUMMARY
